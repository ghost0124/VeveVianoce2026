<div class="counter-card">

    <div class="title">
        ❤️ Together Since ❤️
    </div>

    <div class="date">
        {{ startDate }}
    </div>

    <div class="days">
        {{ days }}
    </div>

    <div class="label">
        Days Together
    </div>

    <div class="time">

        <div class="unit">
            <span>{{ hours }}</span>
            <small>Hours</small>
        </div>

        <div class="unit">
            <span>{{ minutes }}</span>
            <small>Minutes</small>
        </div>

        <div class="unit">
            <span>{{ seconds }}</span>
            <small>Seconds</small>
        </div>

    </div>

</div>
